
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeminiCourse Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/react-quill@2.0.0-beta.2/dist/quill.snow.css">
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .ql-editor { min-height: 200px; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }

      /* Fallback for Tailwind Typography 'prose' */
      .prose { color: #374151; line-height: 1.625; }
      .prose h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 1.5rem; color: #111827; }
      .prose h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; color: #111827; }
      .prose p { margin-bottom: 1.25rem; }
      .prose ul { list-style-type: disc; padding-left: 1.625rem; margin-bottom: 1.25rem; }
      .prose ol { list-style-type: decimal; padding-left: 1.625rem; margin-bottom: 1.25rem; }
      .prose img { border-radius: 0.5rem; margin-top: 2rem; margin-bottom: 2rem; }
      .prose strong { font-weight: 600; color: #111827; }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.463.0",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",

    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "jszip": "https://esm.sh/jszip@^3.10.1",
    "zustand": "https://esm.sh/zustand@^5.0.11",
    "@dnd-kit/core": "https://esm.sh/@dnd-kit/core@^6.3.1",
    "react-quill": "https://esm.sh/react-quill@^2.0.0",
    "@dnd-kit/sortable": "https://esm.sh/@dnd-kit/sortable@^10.0.0",
    "@dnd-kit/utilities": "https://esm.sh/@dnd-kit/utilities@^3.2.2"
  }
}
</script>
</head>
<body class="bg-slate-50 overflow-hidden">
    <div id="root"></div>
</body>
